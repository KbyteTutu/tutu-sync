---
# tutu-mcp 2.0 配置模板。复制为 config.yaml 后修改。
# - 支持 ${ENV_VAR} 插值；密钥一律走环境变量（见 .env.example）
# - 相对路径相对本文件所在目录解析
# - config.yaml 含敏感信息：chmod 600，不要提交

log_level: info

server:
  # 默认只听回环，由宿主机反代（TLS）对外；仅内网使用时改成 192.168.125.1
  host: 127.0.0.1
  port: 60380
  # 生成引导命令用的对外地址（新主机执行 curl <public_url>/init.sh）
  public_url: https://mcp.tutu.gold

storage:
  path: /data/tutu-mcp.db

# ---- WireGuard 中心端 ----
# 本机就是 wg 服务器时才配置；compose 需 network_mode: host + NET_ADMIN
# + 挂载 /etc/wireguard。省略整段则 wg_* 工具报告不可用（其余功能正常）。
wg:
  config: /etc/wireguard/wg0.conf
  interface: wg0
  subnet: 192.168.125.0/24
  server_ip: 192.168.125.1
  server_public_key: Aw+eKGt/x+WmRLBvfX5fzHQLxtsuxDWhxIhYiZXbLxM=
  endpoint: tutu.gold:60399
  # 客户端 DNS hook；目标机无 systemd-resolved 时设 null（init.sh 也会自动剔除）
  dns: 192.168.125.1
  dns_domain: "~tu"

# ---- pi 模型与扩展 ----
pi:
  # 容器内作为 HOME 的目录：规范 models.json 在 <home>/.pi/agent/models.json
  home: /data/pi-home
  # 新主机应安装的扩展（packages 源）
  extensions:
    - npm:@vigolium/piolium
    - npm:pi-web-access
    - npm:pi-lens
    - npm:bigpowers
    - npm:context-mode

# ---- 文件分享代理（服务本身不归本项目部署）----
share:
  upload: http://192.168.125.11:60306
  public_base: https://nas.tutu.gold

# ---- 邮件（可选，默认整段注释）----
