---
# tutu-mcp 2.0 配置模板
#
# 默认形态：wg 内网中心，跑在 192.168.125.11，由本机 nginx 暴露
# http://192.168.125.11/mcp（见 deploy/nginx-tutu-mcp.conf）。
#
# - 支持 ${ENV_VAR} 插值；密钥一律走环境变量（见 .env.example）
# - 相对路径相对本文件所在目录解析
# - config.yaml 含敏感信息：chmod 600，不要提交

log_level: info

server:
  # 容器内监听；对外暴露由 compose 映射到 127.0.0.1，再由 nginx 反代，不会直接暴露到 LAN
  host: 0.0.0.0
  port: 60380
  # 客户端使用的地址（写进 mcp.json / init.sh 命令），必须与 nginx 入口一致
  public_url: http://192.168.125.11

storage:
  path: /data/tutu-mcp.db

# ---- WireGuard（通过 WGDashboard REST API 管理）----
# 节点的新增/删除/密钥生成/IP 分配都由 WGDashboard 完成，本服务只调 API。
# 因此中心跑在 192.168.125.11 也能管 wg，不需要 host 网络 / NET_ADMIN / 挂载 /etc/wireguard。
# 前提：从中心能访问 dashboard.url（默认走 wg 隧道），并在面板 Settings 最下方生成 API Key。
wg:
  dashboard:
    url: http://192.168.125.1:10086
    api_key: ${WGDASHBOARD_API_KEY}
  # 面板里的配置名
  configuration: wg0
  # 客户端配置里的 Endpoint（公网域名:端口）
  endpoint: tutu.gold:60399
  # 客户端 resolvectl domain（*.tu 域名解析）
  dns_domain: "~tu"

# ---- pi 模型与扩展 ----
pi:
  # 容器内作为 HOME 的目录：规范 models.json 在 <home>/.pi/agent/models.json
  home: /data/pi-home
  # 新主机应安装的扩展（packages 源）
  extensions:
    - npm:@vigolium/piolium
    - npm:pi-web-access
    - npm:pi-lens
    - npm:bigpowers
    - npm:context-mode

# ---- 文件分享代理（服务本身不归本项目部署）----
share:
  upload: http://192.168.125.11:60306
  public_base: https://nas.tutu.gold

