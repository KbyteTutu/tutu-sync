## .tmux.conf

##### 基础设置 #####

set -g extended-keys on
set -g extended-keys-format csi-u


# 使用 256 色 / true color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# 启用鼠标（滚轮滚动，但不接管右键）
set -g mouse on

# 禁止 tmux 接管右键：右键事件不做任何绑定，终端自己显示菜单
unbind -n MouseDown3Pane
unbind -n MouseDrag3Pane
unbind -n MouseUp3Pane

# 历史滚动行数
set -g history-limit 100000

# 从 1 开始编号窗口和 pane
set -g base-index 1
setw -g pane-base-index 1

# 自动重新编号窗口
set -g renumber-windows on

# 缩短命令延迟，让 Esc / Vim 更灵敏
set -s escape-time 10

# 状态栏刷新间隔
set -g status-interval 5

# 支持焦点事件，部分编辑器 / 程序会用到
set -g focus-events on

# 默认 shell，可按需修改
# set -g default-shell /bin/zsh

##### 窗口与 pane 操作 #####

# 使用 | 和 - 分屏，比默认按键直观
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 新窗口默认打开在当前目录
bind c new-window -c "#{pane_current_path}"

# 水平 / 垂直分屏也默认继承当前目录
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# 使用 Alt + 方向键切换 pane，无需 prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# 使用 Ctrl + 方向键调整 pane 大小
bind -n C-Left resize-pane -L 5
bind -n C-Right resize-pane -R 5
bind -n C-Up resize-pane -U 2
bind -n C-Down resize-pane -D 2

# 快速重载配置
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded!"


##### Vim 风格操作 #####

# copy mode 使用 vi 风格
setw -g mode-keys vi

# pane 切换使用 vim 键位
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# pane 调整大小使用大写 H/J/K/L
bind H resize-pane -L 5
bind J resize-pane -D 2
bind K resize-pane -U 2
bind L resize-pane -R 5


##### 复制模式 #####

# 进入复制模式
bind [ copy-mode

# vi 模式下用 v 开始选择，y 复制
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# 鼠标拖选后复制
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel


##### Tmux Plugin Manager (TPM) #####

# 插件列表
set -g @plugin 'tmux-plugins/tpm'

# 启用 tmux 内置 OSC 52 剪贴板（tmux 3.3a+，通过终端支持远程复制）
set -g set-clipboard on

# 初始化 TPM（必须放在配置最底部）
run '~/.tmux/plugins/tpm/tpm'


##### 状态栏外观 #####

# 状态栏位置
set -g status-position bottom

# 状态栏颜色
set -g status-style bg=colour235,fg=colour248

# 左侧状态栏
set -g status-left-length 40
set -g status-left "#[fg=colour green,bold] #S #[default]"

# 右侧状态栏
set -g status-right-length 100
set -g status-right "#[fg=colour246]%Y-%m-%d #[fg=colour39]%H:%M "

# 当前窗口样式
setw -g window-status-current-style bg=colour39,fg=colour235,bold
setw -g window-status-current-format " #I:#W "

# 普通窗口样式
setw -g window-status-style fg=colour248,bg=colour235
setw -g window-status-format " #I:#W "

# pane 边框样式
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

# 消息样式
set -g message-style bg=colour39,fg=colour235,bold


##### 更现代的行为 #####

# 窗口活动提示
setw -g monitor-activity on
set -g visual-activity off

# 允许终端修改标题
set -g set-titles on

# 窗口名自动跟随当前命令
setw -g automatic-rename on

# aggressive-resize 让多个客户端连接时尺寸更合理
setw -g aggressive-resize on

