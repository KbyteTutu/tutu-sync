---
# tutu-mcp 2.0 — 内网中心（默认跑在 192.168.125.11）
#
# 暴露方式：容器只映射到宿主回环 127.0.0.1:60380，由本机 nginx 反代
# http://192.168.125.11/mcp（见 deploy/nginx-tutu-mcp.conf）。
# 因此不需要 NET_ADMIN，也不会把端口直接暴露到 LAN/公网。
#
# 启动:
#   cp config.example.yaml config.yaml && chmod 600 config.yaml
#   cp .env.example .env && chmod 600 .env      # 填 TUTU_MASTER_TOKEN
#   docker compose up -d --build
#
# ---- 仅当本机是 wg 服务器（192.168.125.1）----
# 需要 wg 域时，把下面三行注释打开，并删掉上面的 ports 段（host 网络与端口映射互斥），
# 同时在 config.yaml 打开 wg 段：
#     network_mode: host
#     cap_add: [NET_ADMIN]
#     volumes: /etc/wireguard:/etc/wireguard
services:
  tutu-mcp:
    build: .
    image: tutu-mcp:2.0.0
    container_name: tutu-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:60380:60380"
    env_file:
      # .env 不存在时也能 config/up（服务会以缺少 TUTU_MASTER_TOKEN 明确报错）
      - path: .env
        required: false
    volumes:
      - ./data:/data
      - ./config.yaml:/app/config/config.yaml:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:60380/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
