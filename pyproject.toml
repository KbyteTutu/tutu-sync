[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tutu-sync"
version = "0.1.0"
description = "Personal config sync tool for multi-device environments"
requires-python = ">=3.10"
readme = "AGENTS.md"
license = {text = "MIT"}
dependencies = [
    "click>=8.0",
    "pyrage>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[project.scripts]
tutu-sync = "tutu_sync.cli:main"

[project.entry-points."tutu_sync.modules"]
opencode = "tutu_sync.modules.opencode:OpenCodeModule"
piagent = "tutu_sync.modules.piagent:PiAgentModule"

[tool.setuptools.packages.find]
include = ["tutu_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
