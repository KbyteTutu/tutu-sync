# tutu-mcp — wg 内网入口（http://192.168.125.11/mcp）
#
# 安装:
#   sudo cp deploy/nginx-tutu-mcp.conf /etc/nginx/conf.d/tutu-mcp.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 依赖: /etc/nginx/sites-enabled/default 已有 listen 80 default_server（本机现状）。
# 本 server 块按 Host=192.168.125.11 匹配，不影响 default_server 与其他 vhost。
# 客户端 mcp.json 写: "url": "http://192.168.125.11/mcp"
server {
    listen 80;
    listen [::]:80;
    server_name 192.168.125.11;

    # 只允许 tutu 内网（wg）与家里 LAN；其他来源直接拒绝
    allow 192.168.125.0/24;
    allow 192.168.50.0/24;
    deny all;

    client_max_body_size 4m;

    # MCP：SSE 流式响应，必须关缓冲
    location = /mcp {
        proxy_pass http://127.0.0.1:60380;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 一次性注册码兑换：只允许 POST
    location = /api/enroll {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:60380;
    }

    # 新主机引导资源（非敏感）
    location = /init.sh {
        proxy_pass http://127.0.0.1:60380;
    }
    location /assets/ {
        proxy_pass http://127.0.0.1:60380;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:60380;
    }

    location / { return 404; }
}
